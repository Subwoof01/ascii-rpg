[package]
name = "ascii_rpg"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
bincode = { version = "1.3.3" }
crossterm = "0.29.0"
ctrlc = { version = "3.4.7", features = ["termination"] }
hecs = { version = "0.10.5", features = ["column-serialize", "row-serialize"] }
rand = "0.9.1"
serde = { version = "1.0.219", features = ["derive"] }
